<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in or create a free RyuStream account to track your watchlist and watch history.">
  <title>Sign In — RyuStream</title>
  <link rel="icon" href="/assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">

  <a class="login-logo" href="/"><img src="/assets/logo.svg" alt="RyuStream" class="nav-logo-img" style="height:36px"></a>

  <div class="login-card">
    <!-- Tab switcher -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">Sign In</button>
      <button class="auth-tab" id="tab-register">Create Account</button>
    </div>

    <!-- Login Form -->
    <form class="auth-form" id="login-form" novalidate>
      <h2 class="auth-title">Welcome back</h2>

      <div class="field-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field-group">
        <label for="login-password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" data-target="#login-password" aria-label="Toggle password">👁</button>
        </div>
      </div>

      <div style="text-align:right;margin-top:-10px">
        <button type="button" id="forgot-pw-btn" style="background:none;border:none;color:var(--accent);font-size:0.8rem;font-weight:600;cursor:pointer;padding:0">Forgot password?</button>
      </div>

      <p class="auth-error" id="login-error"></p>
      <button type="submit" class="btn btn-primary auth-submit" id="login-submit">Sign In</button>
    </form>

    <!-- Register Form -->
    <form class="auth-form" id="register-form" style="display:none" novalidate>
      <h2 class="auth-title">Create your account</h2>

      <div class="field-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field-group">
        <label for="reg-username">Username</label>
        <input type="text" id="reg-username" placeholder="Choose a username" autocomplete="username" required>
      </div>

      <div class="field-group">
        <label for="reg-password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="reg-password" placeholder="Min 6 characters" autocomplete="new-password" required>
          <button type="button" class="toggle-pw" data-target="#reg-password" aria-label="Toggle password">👁</button>
        </div>
      </div>

      <div class="field-group">
        <label for="reg-password2">Confirm Password</label>
        <div class="pw-wrap">
          <input type="password" id="reg-password2" placeholder="Repeat password" autocomplete="new-password" required>
          <button type="button" class="toggle-pw" data-target="#reg-password2" aria-label="Toggle password">👁</button>
        </div>
      </div>

      <p class="auth-error" id="register-error"></p>
      <button type="submit" class="btn btn-primary auth-submit">Create Account</button>

      <p class="auth-terms">By creating an account you agree to our Terms of Use.</p>
    </form>

    <!-- Forgot Password / OTP Form -->
    <div class="auth-form" id="otp-form" style="display:none">
      <button type="button" id="otp-back-btn" style="background:none;border:none;color:var(--text-2);font-size:0.82rem;cursor:pointer;padding:0;margin-bottom:12px;display:flex;align-items:center;gap:6px">← Back to Sign In</button>
      <h2 class="auth-title" id="otp-title">Forgot password?</h2>
      <p style="color:var(--text-2);font-size:0.88rem;margin-bottom:20px" id="otp-subtitle">Enter your registered email and we'll send you a sign-in code.</p>

      <!-- Step 1: Email -->
      <div id="otp-step-email">
        <div class="field-group">
          <label for="otp-email">Registered Email</label>
          <input type="email" id="otp-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <p class="auth-error" id="otp-email-error"></p>
        <button type="button" class="btn btn-primary auth-submit" id="otp-send-btn">Send Code</button>
      </div>

      <!-- Step 2: OTP -->
      <div id="otp-step-code" style="display:none">
        <div class="field-group">
          <label for="otp-code">6-digit Code</label>
          <input type="text" id="otp-code" placeholder="_ _ _ _ _ _" maxlength="6" autocomplete="one-time-code"
            style="font-size:1.6rem;letter-spacing:10px;text-align:center;font-weight:800;font-family:'Outfit',sans-serif">
        </div>
        <p style="color:var(--text-3);font-size:0.78rem;text-align:center;margin-top:-8px">Code sent! Check your inbox (and spam).</p>
        <p class="auth-error" id="otp-code-error"></p>
        <button type="button" class="btn btn-primary auth-submit" id="otp-verify-btn">Verify & Sign In</button>
        <button type="button" id="otp-resend-btn" style="background:none;border:none;color:var(--accent);font-size:0.8rem;font-weight:600;cursor:pointer;width:100%;margin-top:12px;text-align:center">Resend Code</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
