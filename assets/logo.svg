<svg viewBox="0 0 170 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RyuStream">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e052a0"/>
      <stop offset="100%" style="stop-color:#f15c41"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e052a0"/>
      <stop offset="100%" style="stop-color:#f15c41"/>
    </linearGradient>
  </defs>
  <!-- Dragon icon: stylized flame/wing shape -->
  <polygon points="4,4 18,4 22,12 18,20 4,20 0,12" fill="url(#iconGrad)" opacity="0.15"/>
  <polygon points="4,4 18,4 22,12 18,20 4,20 0,12" fill="none" stroke="url(#iconGrad)" stroke-width="1.5"/>
  <!-- Dragon "Ryu" play arrow -->
  <polygon points="7,8 17,12 7,16" fill="url(#iconGrad)"/>
  <!-- "RyuStream" wordmark -->
  <text x="28" y="27" font-family="'Outfit','Inter',sans-serif" font-weight="800" font-size="22" fill="url(#logoGrad)" letter-spacing="-0.5">Ryu</text>
  <text x="74" y="27" font-family="'Outfit','Inter',sans-serif" font-weight="300" font-size="22" fill="white" letter-spacing="-0.5">Stream</text>
</svg>